<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>야추다이스</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f8f9fa;
    color: #2c3e50;
    padding: 20px;
    min-height: 100vh;
}

.container {
    max-width: 600px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    padding: 32px;
}

h1 {
    text-align: center;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 32px;
    color: #1a1a1a;
}

.game-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 24px;
    padding: 16px;
    background: #f8f9fa;
    border-radius: 12px;
    font-size: 14px;
}

.info-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.info-label {
    color: #6c757d;
    font-size: 12px;
}

.info-value {
    font-weight: 600;
    font-size: 18px;
    color: #1a1a1a;
}

.dice-container {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 32px 0;
    flex-wrap: wrap;
}

.die {
    width: 64px;
    height: 64px;
    background: white;
    border: 2px solid #dee2e6;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
}

.die:hover {
    border-color: #adb5bd;
}

.die.held {
    background: #2c3e50;
    color: white;
    border-color: #2c3e50;
}

.die.empty {
    color: #dee2e6;
}

.controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin: 24px 0;
}

button {
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-primary {
    background: #2c3e50;
    color: white;
}

.btn-primary:hover:not(:disabled) {
    background: #1a252f;
}

.btn-secondary {
    background: #e9ecef;
    color: #495057;
}

.btn-secondary:hover {
    background: #dee2e6;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.scorecard {
    margin-top: 32px;
}

.score-section {
    margin-bottom: 24px;
}

.section-title {
    font-size: 13px;
    font-weight: 600;
    color: #6c757d;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
}

.score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    margin-bottom: 8px;
    background: #f8f9fa;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
}

.score-row:hover:not(.used):not(.disabled) {
    background: #e9ecef;
}

.score-row.used {
    opacity: 0.5;
    cursor: not-allowed;
}

.score-row.disabled {
    cursor: not-allowed;
}

.score-name {
    font-size: 15px;
    color: #495057;
}

.score-value {
    font-weight: 600;
    font-size: 16px;
    color: #2c3e50;
    min-width: 40px;
    text-align: right;
}

.score-row.used .score-value {
    color: #1a1a1a;
}

/* 상단 보너스 */
.bonus-panel {
    margin-top: 12px;
    padding: 16px;
    background: #f8f9fa;
    border: 1px solid #dee2e6;
    border-radius: 10px;
    transition: background 0.2s, border-color 0.2s;
}

.bonus-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.bonus-title {
    font-size: 14px;
    font-weight: 600;
    color: #495057;
}

.bonus-count {
    font-size: 15px;
    font-weight: 600;
    color: #2c3e50;
    white-space: nowrap;
}

.bonus-progress {
    height: 8px;
    overflow: hidden;
    background: #e9ecef;
    border-radius: 999px;
}

.bonus-progress-fill {
    width: 0%;
    height: 100%;
    background: #6c757d;
    border-radius: 999px;
    transition: width 0.3s ease, background 0.2s;
}

.bonus-status {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 600;
    color: #6c757d;
}

.bonus-panel.earned {
    background: #edf8f1;
    border-color: #a8d5b8;
}

.bonus-panel.earned .bonus-title,
.bonus-panel.earned .bonus-count,
.bonus-panel.earned .bonus-status {
    color: #237a46;
}

.bonus-panel.earned .bonus-progress-fill {
    background: #2e9b59;
}

.bonus-panel.missed .bonus-progress-fill {
    background: #adb5bd;
}

.total-row {
    display: flex;
    justify-content: space-between;
    padding: 16px;
    background: #2c3e50;
    color: white;
    border-radius: 10px;
    margin-top: 24px;
    font-weight: 600;
    font-size: 18px;
}

/* 모달 스타일 */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal {
    background: white;
    border-radius: 16px;
    padding: 40px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    text-align: center;
}

.modal h2 {
    font-size: 24px;
    color: #1a1a1a;
    margin-bottom: 24px;
}

.modal-score {
    margin: 32px 0;
}

.final-score-label {
    font-size: 14px;
    color: #6c757d;
    margin-bottom: 8px;
}

.final-score-value {
    font-size: 48px;
    font-weight: 700;
    color: #2c3e50;
    margin-bottom: 12px;
}

.score-comment {
    font-size: 15px;
    color: #495057;
    margin-top: 8px;
}

.modal-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 32px;
}

.btn-modal-primary {
    background: #2c3e50;
    color: white;
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-modal-primary:hover {
    background: #1a252f;
}

.btn-modal-secondary {
    background: #e9ecef;
    color: #495057;
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-modal-secondary:hover {
    background: #dee2e6;
}

@media (max-width: 640px) {
    .container {
        padding: 20px;
    }

    .die {
        width: 56px;
        height: 56px;
        font-size: 28px;
    }

    .modal {
        padding: 32px 24px;
    }

    .modal-buttons {
        flex-direction: column;
    }

    .btn-modal-primary,
    .btn-modal-secondary {
        width: 100%;
    }
}

/* 기존 1px 위치 보정 유지 */
.die {
    line-height: 1;
    padding-top: 1px;
}

.total-row {
    align-items: center;
    line-height: normal;
}

.total-row > span {
    position: relative;
    top: 1px;
}
    </style>
</head>
<body>
    <div class="container">
        <h1> </h1>

        <div class="game-info">
            <div class="info-item">
                <span class="info-label">남은 굴림</span>
                <span class="info-value" id="rollsLeft">3</span>
            </div>
            <div class="info-item">
                <span class="info-label">현재 점수</span>
                <span class="info-value" id="currentScore">0</span>
            </div>
        </div>

        <div class="dice-container" id="diceContainer">
            <div class="die empty" data-index="0">-</div>
            <div class="die empty" data-index="1">-</div>
            <div class="die empty" data-index="2">-</div>
            <div class="die empty" data-index="3">-</div>
            <div class="die empty" data-index="4">-</div>
        </div>

        <div class="controls">
            <button
                type="button"
                class="btn-primary"
                id="rollBtn"
                onclick="rollDice()"
            >주사위 굴리기</button>
            <button
                type="button"
                class="btn-secondary"
                onclick="resetGame()"
            >새 게임</button>
        </div>

        <div class="scorecard">
            <div class="score-section">
                <div class="section-title">상단 (숫자 합계)</div>

                <div class="score-row disabled" data-category="ones">
                    <span class="score-name">① 에이스</span>
                    <span class="score-value">-</span>
                </div>
                <div class="score-row disabled" data-category="twos">
                    <span class="score-name">② 듀스</span>
                    <span class="score-value">-</span>
                </div>
                <div class="score-row disabled" data-category="threes">
                    <span class="score-name">③ 쓰리</span>
                    <span class="score-value">-</span>
                </div>
                <div class="score-row disabled" data-category="fours">
                    <span class="score-name">④ 포</span>
                    <span class="score-value">-</span>
                </div>
                <div class="score-row disabled" data-category="fives">
                    <span class="score-name">⑤ 파이브</span>
                    <span class="score-value">-</span>
                </div>
                <div class="score-row disabled" data-category="sixes">
                    <span class="score-name">⑥ 식스</span>
                    <span class="score-value">-</span>
                </div>

                <div class="bonus-panel" id="bonusPanel">
                    <div class="bonus-header">
                        <span class="bonus-title">상단 합계</span>
                        <span class="bonus-count" id="upperScore">0 / 63</span>
                    </div>
                    <div
                        class="bonus-progress"
                        id="bonusProgress"
                        role="progressbar"
                        aria-label="상단 보너스 달성 진행률"
                        aria-valuemin="0"
                        aria-valuemax="63"
                        aria-valuenow="0"
                    >
                        <div
                            class="bonus-progress-fill"
                            id="bonusProgressFill"
                        ></div>
                    </div>
                    <div
                        class="bonus-status"
                        id="bonusStatus"
                        aria-live="polite"
                    >보너스 미획득</div>
                </div>
            </div>

            <div class="score-section">
                <div class="section-title">하단 (특수 조합)</div>

                <div class="score-row disabled" data-category="choice">
                    <span class="score-name">초이스</span>
                    <span class="score-value">-</span>
                </div>
                <div class="score-row disabled" data-category="fourOfKind">
                    <span class="score-name">4 카드</span>
                    <span class="score-value">-</span>
                </div>
                <div class="score-row disabled" data-category="fullHouse">
                    <span class="score-name">풀하우스</span>
                    <span class="score-value">-</span>
                </div>
                <div class="score-row disabled" data-category="smallStraight">
                    <span class="score-name">S 스트레이트</span>
                    <span class="score-value">-</span>
                </div>
                <div class="score-row disabled" data-category="largeStraight">
                    <span class="score-name">L 스트레이트</span>
                    <span class="score-value">-</span>
                </div>
                <div class="score-row disabled" data-category="yacht">
                    <span class="score-name">야추</span>
                    <span class="score-value">-</span>
                </div>
            </div>

            <div class="total-row">
                <span>총점</span>
                <span id="totalScore">0</span>
            </div>
        </div>
    </div>

    <!-- 게임 종료 모달 -->
    <div class="modal-overlay" id="gameOverModal">
        <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
        >
            <h2 id="modalTitle">게임 종료</h2>

            <div class="modal-score">
                <div class="final-score-label">최종 점수</div>
                <div class="final-score-value" id="modalFinalScore">0</div>
                <div class="score-comment" id="scoreComment"></div>
            </div>

            <div class="modal-buttons">
                <button
                    type="button"
                    class="btn-modal-primary"
                    onclick="startNewGame()"
                >새 게임</button>
                <button
                    type="button"
                    class="btn-modal-secondary"
                    onclick="closeModal()"
                >점수 보기</button>
            </div>
        </div>
    </div>
    <script>
const UPPER_CATEGORIES = [
    'ones', 'twos', 'threes', 'fours', 'fives', 'sixes'
];
const CATEGORIES = [
    ...UPPER_CATEGORIES,
    'choice', 'fourOfKind', 'fullHouse',
    'smallStraight', 'largeStraight', 'yacht'
];
const BONUS_TARGET = 63;
const BONUS_POINTS = 35;
const MAX_ROLLS = 3;

// 통계적 백분위가 아닌 운영용 평가 기준
const EVALUATIONS = [
    { min: 280, title: '🎉 완벽해요!', comment: '최고 수준의 점수입니다!' },
    { min: 250, title: '👏 훌륭해요!', comment: '매우 높은 점수입니다!' },
    { min: 200, title: '게임 종료', comment: '좋은 플레이였어요!' },
    { min: 0, title: '게임 종료', comment: '' }
];

let dice = [0, 0, 0, 0, 0];
let heldDice = [false, false, false, false, false];
let rollsLeft = MAX_ROLLS;
let scores = {};
let totalScore = 0;
let gameOver = false;

function isCategoryUsed(category) {
    return Object.prototype.hasOwnProperty.call(scores, category);
}

function hasRolled() {
    return rollsLeft < MAX_ROLLS &&
        dice.every(value => value >= 1 && value <= 6);
}

function rollDice() {
    if (gameOver || rollsLeft <= 0) return;

    for (let i = 0; i < dice.length; i++) {
        if (!heldDice[i]) {
            dice[i] = Math.floor(Math.random() * 6) + 1;
        }
    }

    rollsLeft--;
    updateDisplay();
    updateScoreOptions();
}

function toggleHold(index) {
    if (gameOver || !hasRolled()) return;
    if (index < 0 || index >= dice.length) return;

    heldDice[index] = !heldDice[index];
    updateDisplay();
}

function updateDisplay() {
    document.getElementById('rollsLeft').textContent = rollsLeft;

    document.querySelectorAll('.die').forEach((die, index) => {
        const empty = dice[index] === 0;
        die.textContent = empty ? '-' : dice[index];
        die.classList.toggle('empty', empty);
        die.classList.toggle('held', !empty && heldDice[index]);
    });

    const rollButton = document.getElementById('rollBtn');
    rollButton.disabled = gameOver || rollsLeft <= 0;
    rollButton.textContent = gameOver ? '게임 종료' : '주사위 굴리기';
}

function updateScoreOptions() {
    const canSelect = !gameOver && hasRolled();

    document.querySelectorAll('.score-row').forEach(row => {
        const category = row.dataset.category;
        const used = isCategoryUsed(category);
        const value = row.querySelector('.score-value');

        row.classList.toggle('used', used);
        row.classList.toggle('disabled', used || !canSelect);

        if (used) {
            // 0점으로 확정한 항목도 그대로 유지
            value.textContent = scores[category];
        } else {
            value.textContent = canSelect ? calculateScore(category) : '-';
        }
    });
}

function calculateScore(category) {
    if (!hasRolled()) return 0;

    const counts = Array(7).fill(0);
    dice.forEach(value => counts[value]++);
    const sum = dice.reduce((total, value) => total + value, 0);

    switch (category) {
        case 'ones':
            return counts[1];
        case 'twos':
            return counts[2] * 2;
        case 'threes':
            return counts[3] * 3;
        case 'fours':
            return counts[4] * 4;
        case 'fives':
            return counts[5] * 5;
        case 'sixes':
            return counts[6] * 6;
        case 'choice':
            return sum;
        case 'fourOfKind':
            return counts.some(count => count >= 4) ? sum : 0;
        case 'fullHouse':
            return counts.includes(3) && counts.includes(2) ? 25 : 0;
        case 'smallStraight': {
            const patterns = [
                [1, 2, 3, 4],
                [2, 3, 4, 5],
                [3, 4, 5, 6]
            ];
            return patterns.some(pattern =>
                pattern.every(value => counts[value] > 0)
            ) ? 30 : 0;
        }
        case 'largeStraight': {
            const patterns = [
                [1, 2, 3, 4, 5],
                [2, 3, 4, 5, 6]
            ];
            return patterns.some(pattern =>
                pattern.every(value => counts[value] > 0)
            ) ? 40 : 0;
        }
        case 'yacht':
            return counts.includes(5) ? 50 : 0;
        default:
            return 0;
    }
}

function updateTotals() {
    const upperTotal = UPPER_CATEGORIES.reduce(
        (sum, category) => sum + (scores[category] ?? 0), 0
    );
    const earned = upperTotal >= BONUS_TARGET;
    const upperComplete = UPPER_CATEGORIES.every(isCategoryUsed);

    // 매번 합계로 재계산하여 보너스 중복 지급 방지
    const baseTotal = CATEGORIES.reduce(
        (sum, category) => sum + (scores[category] ?? 0), 0
    );
    totalScore = baseTotal + (earned ? BONUS_POINTS : 0);

    document.getElementById('currentScore').textContent = totalScore;
    document.getElementById('totalScore').textContent = totalScore;
    document.getElementById('upperScore').textContent =
        `${upperTotal} / ${BONUS_TARGET}`;

    const progress = Math.min(upperTotal / BONUS_TARGET, 1) * 100;
    document.getElementById('bonusProgressFill').style.width =
        `${progress}%`;

    const progressElement = document.getElementById('bonusProgress');
    progressElement.setAttribute(
        'aria-valuenow', String(Math.min(upperTotal, BONUS_TARGET))
    );
    progressElement.setAttribute(
        'aria-valuetext', `상단 합계 ${upperTotal}점, 목표 ${BONUS_TARGET}점`
    );

    const panel = document.getElementById('bonusPanel');
    panel.classList.toggle('earned', earned);
    panel.classList.toggle('missed', upperComplete && !earned);

    document.getElementById('bonusStatus').textContent =
        earned ? '✓ 보너스 획득 +35점' : '보너스 미획득';
}

function selectScore(category) {
    if (gameOver || !hasRolled()) return;
    if (!CATEGORIES.includes(category) || isCategoryUsed(category)) return;

    scores[category] = calculateScore(category);
    gameOver = CATEGORIES.every(isCategoryUsed);

    if (gameOver) {
        rollsLeft = 0;
        heldDice = Array(5).fill(false);
    } else {
        dice = Array(5).fill(0);
        heldDice = Array(5).fill(false);
        rollsLeft = MAX_ROLLS;
    }

    updateTotals();
    updateDisplay();
    updateScoreOptions();

    if (gameOver) showGameOver();
}

function showGameOver() {
    const evaluation = EVALUATIONS.find(item => totalScore >= item.min);

    document.getElementById('modalTitle').textContent = evaluation.title;
    document.getElementById('modalFinalScore').textContent = totalScore;

    const comment = document.getElementById('scoreComment');
    comment.textContent = evaluation.comment;
    comment.hidden = evaluation.comment === '';

    document.getElementById('gameOverModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('gameOverModal').style.display = 'none';
}

function resetGame() {
    closeModal();
    dice = Array(5).fill(0);
    heldDice = Array(5).fill(false);
    rollsLeft = MAX_ROLLS;
    scores = {};
    totalScore = 0;
    gameOver = false;

    updateTotals();
    updateDisplay();
    updateScoreOptions();
}

function startNewGame() {
    resetGame();
}

function initializeGame() {
    document.querySelectorAll('.die').forEach((die, index) => {
        die.addEventListener('click', () => toggleHold(index));
    });

    document.querySelectorAll('.score-row').forEach(row => {
        row.addEventListener('click', () => {
            selectScore(row.dataset.category);
        });
    });

    resetGame();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeGame);
} else {
    initializeGame();
}
</script>
</body>
</html>

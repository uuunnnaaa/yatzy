<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>야추다이스</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f8f9fa;
    color: #2c3e50;
    padding: 20px;
    min-height: 100vh;
}

.container {
    max-width: 600px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    padding: 32px;
}

h1 {
    text-align: center;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 32px;
    color: #1a1a1a;
}

.game-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 24px;
    padding: 16px;
    background: #f8f9fa;
    border-radius: 12px;
    font-size: 14px;
}

.info-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.info-label {
    color: #6c757d;
    font-size: 12px;
}

.info-value {
    font-weight: 600;
    font-size: 18px;
    color: #1a1a1a;
}

.dice-container {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 32px 0;
    flex-wrap: wrap;
}

.die {
    width: 64px;
    height: 64px;
    background: white;
    border: 2px solid #dee2e6;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
}

.die:hover {
    border-color: #adb5bd;
}

.die.held {
    background: #2c3e50;
    color: white;
    border-color: #2c3e50;
}

.die.empty {
    color: #dee2e6;
}

.controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin: 24px 0;
}

button {
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-primary {
    background: #2c3e50;
    color: white;
}

.btn-primary:hover:not(:disabled) {
    background: #1a252f;
}

.btn-secondary {
    background: #e9ecef;
    color: #495057;
}

.btn-secondary:hover {
    background: #dee2e6;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.scorecard {
    margin-top: 32px;
}

.score-section {
    margin-bottom: 24px;
}

.section-title {
    font-size: 13px;
    font-weight: 600;
    color: #6c757d;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
}

.score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    margin-bottom: 8px;
    background: #f8f9fa;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
}

.score-row:hover:not(.used):not(.disabled) {
    background: #e9ecef;
}

.score-row.used {
    opacity: 0.5;
    cursor: not-allowed;
}

.score-row.disabled {
    cursor: not-allowed;
}

.score-name {
    font-size: 15px;
    color: #495057;
}

.score-value {
    font-weight: 600;
    font-size: 16px;
    color: #2c3e50;
    min-width: 40px;
    text-align: right;
}

.score-row.used .score-value {
    color: #1a1a1a;
}

.total-row {
    display: flex;
    justify-content: space-between;
    padding: 16px;
    background: #2c3e50;
    color: white;
    border-radius: 10px;
    margin-top: 24px;
    font-weight: 600;
    font-size: 18px;
}

/* 모달 스타일 */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal {
    background: white;
    border-radius: 16px;
    padding: 40px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    text-align: center;
}

.modal h2 {
    font-size: 24px;
    color: #1a1a1a;
    margin-bottom: 24px;
}

.modal-score {
    margin: 32px 0;
}

.final-score-label {
    font-size: 14px;
    color: #6c757d;
    margin-bottom: 8px;
}

.final-score-value {
    font-size: 48px;
    font-weight: 700;
    color: #2c3e50;
    margin-bottom: 12px;
}

.score-comment {
    font-size: 15px;
    color: #495057;
    margin-top: 8px;
}

.modal-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 32px;
}

.btn-modal-primary {
    background: #2c3e50;
    color: white;
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-modal-primary:hover {
    background: #1a252f;
}

.btn-modal-secondary {
    background: #e9ecef;
    color: #495057;
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-modal-secondary:hover {
    background: #dee2e6;
}

@media (max-width: 640px) {
    .container {
        padding: 20px;
    }

    .die {
        width: 56px;
        height: 56px;
        font-size: 28px;
    }

    .modal {
        padding: 32px 24px;
    }

    .modal-buttons {
        flex-direction: column;
    }

    .btn-modal-primary,
    .btn-modal-secondary {
        width: 100%;
    }
}
.die {
    line-height: 1;
    padding-top: 1px;
}

.total-row {
    align-items: center;
    line-height: normal;
}

.total-row > span {
    position: relative;
    top: 2px;
}
    </style>
</head>
<body>
    <div class="container">
    <h1>야추다이스</h1>

    <div class="game-info">
        <div class="info-item">
            <span class="info-label">남은 굴림</span>
            <span class="info-value" id="rollsLeft">3</span>
        </div>
        <div class="info-item">
            <span class="info-label">현재 점수</span>
            <span class="info-value" id="currentScore">0</span>
        </div>
    </div>

    <div class="dice-container" id="diceContainer">
        <div class="die empty" data-index="0">-</div>
        <div class="die empty" data-index="1">-</div>
        <div class="die empty" data-index="2">-</div>
        <div class="die empty" data-index="3">-</div>
        <div class="die empty" data-index="4">-</div>
    </div>

    <div class="controls">
        <button class="btn-primary" id="rollBtn" onclick="rollDice()">주사위 굴리기</button>
        <button class="btn-secondary" onclick="resetGame()">새 게임</button>
    </div>

    <div class="scorecard">
        <div class="score-section">
            <div class="section-title">상단 (숫자 합계)</div>
            <div class="score-row disabled" data-category="ones">
                <span class="score-name">① 에이스</span>
                <span class="score-value">-</span>
            </div>
            <div class="score-row disabled" data-category="twos">
                <span class="score-name">② 듀스</span>
                <span class="score-value">-</span>
            </div>
            <div class="score-row disabled" data-category="threes">
                <span class="score-name">③ 쓰리</span>
                <span class="score-value">-</span>
            </div>
            <div class="score-row disabled" data-category="fours">
                <span class="score-name">④ 포</span>
                <span class="score-value">-</span>
            </div>
            <div class="score-row disabled" data-category="fives">
                <span class="score-name">⑤ 파이브</span>
                <span class="score-value">-</span>
            </div>
            <div class="score-row disabled" data-category="sixes">
                <span class="score-name">⑥ 식스</span>
                <span class="score-value">-</span>
            </div>
        </div>

        <div class="score-section">
            <div class="section-title">하단 (특수 조합)</div>
            <div class="score-row disabled" data-category="choice">
                <span class="score-name">초이스</span>
                <span class="score-value">-</span>
            </div>
            <div class="score-row disabled" data-category="threeOfKind">
                <span class="score-name">3 카드</span>
                <span class="score-value">-</span>
            </div>
            <div class="score-row disabled" data-category="fourOfKind">
                <span class="score-name">4 카드</span>
                <span class="score-value">-</span>
            </div>
            <div class="score-row disabled" data-category="fullHouse">
                <span class="score-name">풀하우스</span>
                <span class="score-value">-</span>
            </div>
            <div class="score-row disabled" data-category="smallStraight">
                <span class="score-name">S 스트레이트</span>
                <span class="score-value">-</span>
            </div>
            <div class="score-row disabled" data-category="largeStraight">
                <span class="score-name">L 스트레이트</span>
                <span class="score-value">-</span>
            </div>
            <div class="score-row disabled" data-category="yacht">
                <span class="score-name">야추</span>
                <span class="score-value">-</span>
            </div>
        </div>

        <div class="total-row">
            <span>총점</span>
            <span id="totalScore">0</span>
        </div>
    </div>
</div>

<!-- 게임 종료 모달 -->
<div class="modal-overlay" id="gameOverModal">
    <div class="modal">
        <h2 id="modalTitle">게임 종료</h2>
        <div class="modal-score">
            <div class="final-score-label">최종 점수</div>
            <div class="final-score-value" id="modalFinalScore">0</div>
            <div class="score-comment" id="scoreComment"></div>
        </div>
        <div class="modal-buttons">
            <button class="btn-modal-primary" onclick="startNewGame()">새 게임</button>
            <button class="btn-modal-secondary" onclick="closeModal()">점수 보기</button>
        </div>
    </div>
</div>
<script>
let dice = [0, 0, 0, 0, 0];
let heldDice = [false, false, false, false, false];
let rollsLeft = 3;
let scores = {};
let totalScore = 0;

// 주사위 클릭 이벤트
document.addEventListener('DOMContentLoaded', function() {
    const diceElements = document.querySelectorAll('.die');
    diceElements.forEach((die, index) => {
        die.addEventListener('click', () => toggleHold(index));
    });

    const scoreRows = document.querySelectorAll('.score-row');
    scoreRows.forEach(row => {
        row.addEventListener('click', () => {
            const category = row.dataset.category;
            if (!row.classList.contains('used') && !row.classList.contains('disabled')) {
                selectScore(category);
            }
        });
    });
});

function rollDice() {
    if (rollsLeft <= 0) return;

    for (let i = 0; i < 5; i++) {
        if (!heldDice[i]) {
            dice[i] = Math.floor(Math.random() * 6) + 1;
        }
    }

    rollsLeft--;
    updateDisplay();
    updateScoreOptions();
}

function toggleHold(index) {
    if (dice[index] === 0) return;
    heldDice[index] = !heldDice[index];
    updateDisplay();
}

function updateDisplay() {
    document.getElementById('rollsLeft').textContent = rollsLeft;

    const diceElements = document.querySelectorAll('.die');
    diceElements.forEach((die, index) => {
        if (dice[index] === 0) {
            die.textContent = '-';
            die.classList.add('empty');
            die.classList.remove('held');
        } else {
            die.textContent = dice[index];
            die.classList.remove('empty');
            if (heldDice[index]) {
                die.classList.add('held');
            } else {
                die.classList.remove('held');
            }
        }
    });

    document.getElementById('rollBtn').disabled = rollsLeft <= 0;
}

function updateScoreOptions() {
    const scoreRows = document.querySelectorAll('.score-row');
    scoreRows.forEach(row => {
        const category = row.dataset.category;
        if (!scores[category]) {
            row.classList.remove('disabled');
            const potentialScore = calculateScore(category);
            row.querySelector('.score-value').textContent = potentialScore;
        }
    });
}

function calculateScore(category) {
    const counts = [0, 0, 0, 0, 0, 0, 0];
    dice.forEach(d => counts[d]++);

    switch(category) {
        case 'ones': return counts[1] * 1;
        case 'twos': return counts[2] * 2;
        case 'threes': return counts[3] * 3;
        case 'fours': return counts[4] * 4;
        case 'fives': return counts[5] * 5;
        case 'sixes': return counts[6] * 6;

        case 'choice':
            return dice.reduce((a, b) => a + b, 0);

        case 'threeOfKind':
            for (let i = 1; i <= 6; i++) {
                if (counts[i] >= 3) return dice.reduce((a, b) => a + b, 0);
            }
            return 0;

        case 'fourOfKind':
            for (let i = 1; i <= 6; i++) {
                if (counts[i] >= 4) return dice.reduce((a, b) => a + b, 0);
            }
            return 0;

        case 'fullHouse':
            let hasThree = false;
            let hasTwo = false;
            for (let i = 1; i <= 6; i++) {
                if (counts[i] === 3) hasThree = true;
                if (counts[i] === 2) hasTwo = true;
            }
            return (hasThree && hasTwo) ? 25 : 0;

        case 'smallStraight':
            const smallPatterns = [[1,2,3,4], [2,3,4,5], [3,4,5,6]];
            for (let pattern of smallPatterns) {
                if (pattern.every(n => counts[n] > 0)) return 30;
            }
            return 0;

        case 'largeStraight':
            const largePatterns = [[1,2,3,4,5], [2,3,4,5,6]];
            for (let pattern of largePatterns) {
                if (pattern.every(n => counts[n] === 1)) return 40;
            }
            return 0;

        case 'yacht':
            for (let i = 1; i <= 6; i++) {
                if (counts[i] === 5) return 50;
            }
            return 0;
    }
    return 0;
}

function selectScore(category) {
    const score = calculateScore(category);
    scores[category] = score;
    totalScore += score;

    const row = document.querySelector(`[data-category="${category}"]`);
    row.classList.add('used');
    row.querySelector('.score-value').textContent = score;

    document.getElementById('currentScore').textContent = totalScore;
    document.getElementById('totalScore').textContent = totalScore;

    // 다음 턴 시작
    dice = [0, 0, 0, 0, 0];
    heldDice = [false, false, false, false, false];
    rollsLeft = 3;
    updateDisplay();

    // 모든 카테고리 비활성화
    document.querySelectorAll('.score-row').forEach(r => {
        if (!r.classList.contains('used')) {
            r.classList.add('disabled');
            r.querySelector('.score-value').textContent = '-';
        }
    });

    // 게임 종료 체크
    if (Object.keys(scores).length === 13) {
        endGame();
    }
}

function endGame() {
    const modal = document.getElementById('gameOverModal');
    const finalScore = document.getElementById('modalFinalScore');
    const comment = document.getElementById('scoreComment');
    const title = document.getElementById('modalTitle');

    finalScore.textContent = totalScore;

    // 점수에 따른 평가
    if (totalScore >= 250) {
        title.textContent = '🎉 완벽해요!';
        comment.textContent = '최고 수준의 점수입니다!';
    } else if (totalScore >= 200) {
        title.textContent = '👏 훌륭해요!';
        comment.textContent = '매우 높은 점수입니다!';
    } else if (totalScore >= 150) {
        title.textContent = '게임 종료';
        comment.textContent = '좋은 플레이였어요!';
    } else {
        title.textContent = '게임 종료';
        comment.textContent = '';
    }

    modal.style.display = 'flex';
}

function closeModal() {
    document.getElementById('gameOverModal').style.display = 'none';
}

function startNewGame() {
    closeModal();
    resetGame();
}

function resetGame() {
    dice = [0, 0, 0, 0, 0];
    heldDice = [false, false, false, false, false];
    rollsLeft = 3;
    scores = {};
    totalScore = 0;

    document.getElementById('currentScore').textContent = '0';
    document.getElementById('totalScore').textContent = '0';

    document.querySelectorAll('.score-row').forEach(row => {
        row.classList.remove('used');
        row.classList.add('disabled');
        row.querySelector('.score-value').textContent = '-';
    });

    updateDisplay();
}
</script>
</body>
</html>
